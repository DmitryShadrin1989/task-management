<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User · HedgehogOps</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any">
    <link rel="stylesheet" href="/css/jira-like.css">
</head>

<body onload="uploadDataToPage()">

<header class="app-header">
    <div class="app-brand">
        <span class="app-brand-mark">HO</span>
        <span>HedgehogOps</span>
    </div>
    <nav class="app-nav-links">
        <a th:href="@{/task-management}" href="home.html">Boards</a>
    </nav>
    <div class="current-user" id="currentUser"><span>Current user:</span> </div>
</header>

<main class="app-main">
    <div class="breadcrumbs">
        <a th:href="@{/task-management}" href="home.html">Boards</a>
        <span> / </span>
        <span>User</span>
    </div>
    <h1 class="page-title">User profile</h1>

    <section class="panel" aria-labelledby="user-profile-heading">
        <h2 class="section-title" id="user-profile-heading">Information</h2>
        <div class="form-row">
            <label class="form-label" for="userId">Id</label>
            <input id="userId" name="userId" type="text" readonly="readonly" th:value="*{userId}"/>
        </div>
        <div class="form-row">
            <label class="form-label" for="username">Username</label>
            <input id="username" name="username" type="text"/>
        </div>
    </section>
</main>

<script>
    const gateway_host = "http://localhost:8080";

    let token;
    const currentUser = document.getElementById('currentUser');

    const userId = document.getElementById('userId');
    const username = document.getElementById('username');

    function uploadDataToPage() {
        token = localStorage.getItem('token');
        if (!token) {
            location.href = "/login";
        }
        uploadCurrentUserToPage();

        uploadUserToPage();
    }

    function uploadCurrentUserToPage() {
        fetch(gateway_host + '/api/auth/current', {
            method: "GET",
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: null
        })
            .then(response => response.json())
            .then(user => {
                const userLink = document.createElement("a");
                userLink.innerHTML = user.username;
                userLink.href = "/task-management/user/" + user.id;
                currentUser.appendChild(userLink);
            })
            .catch(error => console.error(error));
    }

    function uploadUserToPage() {
        fetch(gateway_host + '/api/user/' + userId.value, {
            method: "GET",
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: null
        })
            .then(response => response.json())
            .then(user => {
                username.value = user.username;
            })
            .catch(error => {
                console.error(error);
                location.href = "/login";
            });
    }
</script>

</body>
</html>
