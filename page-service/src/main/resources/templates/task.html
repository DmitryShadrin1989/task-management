<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task · HedgehogOps</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any">
    <link rel="stylesheet" href="/css/jira-like.css">
</head>
<body onload="uploadDataToPage()">

<header class="app-header">
    <a class="app-brand app-brand-link" th:href="@{/task-management}" href="home.html">
        <span class="app-brand-mark">HO</span>
        <span class="app-brand-text">HedgehogOps</span>
    </a>
    <form class="app-header-search" role="search" aria-label="Global search"
          onsubmit="event.preventDefault(); showFeatureNotImplemented('Global search'); return false;">
        <label class="sr-only" for="globalSearchInput">Search</label>
        <input id="globalSearchInput" type="search" name="q" placeholder="Search…" autocomplete="off"/>
        <button type="button" class="btn btn-nav" aria-label="Search (stub)" onclick="showFeatureNotImplemented('Global search')">Search</button>
    </form>
    <div class="current-user" id="currentUser" data-user-id=""><span>Current user:</span> </div>
</header>

<main class="app-main">
    <div class="breadcrumbs">
        <a th:href="@{/task-management}" href="home.html">Boards</a>
        <span> / </span>
        <a th:href="@{/task-management/board/{boardId}(boardId=${boardId})}" href="board.html">Board</a>
        <span> / </span>
        <span>Task</span>
    </div>

    <input id="boardId" name="boardId" type="hidden" th:value="*{boardId}"/>

    <div class="task-layout">
        <div class="task-main">
            <label class="sr-only" for="name">Task summary</label>
            <input id="name" name="name" class="task-summary" type="text" value="The brief essence of the task"
                   placeholder="Task summary"/>

            <section class="panel" aria-labelledby="task-desc-heading">
                <h2 class="section-title" id="task-desc-heading">Description</h2>
                <div class="form-row">
                    <label class="form-label sr-only" for="describe">Description</label>
                    <textarea id="describe" name="describe" placeholder="Add a description…">Here you need to enter a description for the task</textarea>
                </div>
            </section>

            <section class="panel" aria-labelledby="task-comments-heading">
                <h2 class="section-title" id="task-comments-heading">Comments</h2>
                <div class="comments-table-wrap">
                    <div id="commentsList" class="comments-list" role="list"></div>
                </div>

                <div class="form-row">
                    <label class="form-label" for="newComment">New comment</label>
                    <textarea id="newComment" name="newComment" placeholder="Write a comment…"></textarea>
                </div>
                <div class="comment-form-actions">
                    <button class="btn btn-primary" type="button" onclick="saveNewComment()">Add comment</button>
                    <button type="button" class="task-attach-btn" aria-label="Attach files to comment"
                            title="Comment attachments (not implemented)"
                            onclick="showFeatureNotImplemented('Comment attachments')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                </div>
            </section>
        </div>

        <aside class="task-sidebar">
            <section class="panel" aria-labelledby="task-details-heading">
                <h2 class="section-title" id="task-details-heading">Details</h2>

                <div class="form-row">
                    <label class="form-label" for="id">Id</label>
                    <input id="id" name="id" type="text" readonly="readonly" th:value="*{id}"/>
                </div>

                <div class="form-row">
                    <label class="form-label" for="author">Author</label>
                    <select id="author"></select>
                </div>

                <div class="form-row">
                    <label class="form-label" for="executor">Executor</label>
                    <select id="executor"></select>
                </div>

                <div class="form-row">
                    <label class="form-label" for="reviewer">Reviewer</label>
                    <select id="reviewer"></select>
                </div>

                <div class="form-row">
                    <label class="form-label" for="creationDate">Creation date</label>
                    <input id="creationDate" name="creationDate" type="date" readonly="readonly"/>
                </div>

                <div class="form-row">
                    <label class="form-label" for="plannedCompletionDate">Planned completion</label>
                    <input id="plannedCompletionDate" name="plannedCompletionDate" type="date"/>
                </div>

                <div class="form-row">
                    <label class="form-label" for="actualCompletionDate">Actual completion</label>
                    <input id="actualCompletionDate" name="actualCompletionDate" type="date"/>
                </div>

                <div class="form-row">
                    <span class="form-label">Status</span>
                    <div class="status-pills">
                        <label><input id="open" type="radio" value="open" name="status"/> Open</label>
                        <label><input id="inQueue" type="radio" value="inQueue" name="status"/> In queue</label>
                        <label><input id="inWork" type="radio" value="inWork" name="status"/> In work</label>
                        <label><input id="onChecking" type="radio" value="onChecking" name="status"/> On checking</label>
                        <label><input id="completed" type="radio" value="completed" name="status"/> Completed</label>
                    </div>
                </div>

                <div class="button-row" id="buttonSave">
                    <button class="btn btn-primary" type="button" onclick="saveTask()">Save</button>
                    <a class="btn btn-subtle" href="board.html" th:href="@{/task-management/board/{boardId}(boardId=${boardId})}">Cancel</a>
                </div>
            </section>
        </aside>
    </div>
</main>

<script src="/js/app-stubs.js"></script>
<script>
    const gateway_host = "http://localhost:8080";

    let token;
    let loggedInUserId = null;
    const currentUser = document.getElementById('currentUser');

    const taskId = document.getElementById('id');
    const boardId = document.getElementById('boardId');
    const taskName = document.getElementById('name');
    const creationDate = document.getElementById('creationDate');
    const plannedCompletionDate = document.getElementById('plannedCompletionDate');
    const actualCompletionDate = document.getElementById('actualCompletionDate');
    const describe = document.getElementById('describe');
    const authorSelect = document.getElementById('author');
    const executorSelect = document.getElementById('executor');
    const reviewerSelect = document.getElementById('reviewer');
    const commentsList = document.getElementById('commentsList');
    const newComment = document.getElementById('newComment');

    function uploadDataToPage() {
        token = localStorage.getItem('token');
        if (!token) {
            location.href = "/login";
        }
        uploadCurrentUserToPage()
            .then(function () {
                if (isValue(taskId.value)) {
                    uploadTaskToPage(taskId);
                    uploadCommentsToPage(taskId);
                } else {
                    setDefaultValues();
                    uploadUsersToPage(null);
                }
            });
    }

    function uploadCurrentUserToPage() {
        return fetch(gateway_host + '/api/auth/current', {
            method: "GET",
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: null
        })
            .then(response => response.json())
            .then(user => {
                loggedInUserId = user.id;
                currentUser.dataset.userId = user.id;
                const userLink = document.createElement("a");
                userLink.textContent = user.username;
                userLink.href = "/task-management/user/" + user.id;
                currentUser.appendChild(userLink);
            })
            .catch(error => {
                console.error(error);
                return null;
            });
    }

    function setDefaultValues() {
        document.getElementById("open").checked = true;
    }

    function uploadTaskToPage(taskId) {
        fetch(gateway_host + '/api/task/' + taskId.value, {
            method: "GET",
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: null
        })
            .then(response => response.json())
            .then(task => {
                boardId.value = task.boardId;
                taskName.value = task.name;
                creationDate.value = task.creationDate;
                plannedCompletionDate.value = task.plannedCompletionDate;
                actualCompletionDate.value = task.actualCompletionDate;
                describe.value = task.describe;
                document.getElementById(task.taskStatusValue).checked = true;
                uploadUsersToPage(task);

                console.log(boardId.value);
            })
            .catch(error => console.error(error));
        console.log(boardId.value);
    }

    function uploadUsersToPage(task) {
        fetch(gateway_host + '/api/board/' + boardId.value + '/user', {
            method: "GET",
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: null
        })
            .then(response => response.json())
            .then(users => {
                users.forEach(user => {
                    const authorOption = document.createElement('option');
                    authorOption.value = user.id;
                    authorOption.textContent = user.username;
                    if (isValue(task) && user.id === task.author.id) {
                        authorOption.selected = true;
                    }
                    authorSelect.appendChild(authorOption);

                    const executorOption = document.createElement('option');
                    executorOption.value = user.id;
                    executorOption.textContent = user.username;
                    if (isValue(task) && user.id === task.executor.id) {
                        executorOption.selected = true;
                    }
                    executorSelect.appendChild(executorOption);

                    const reviewerOption = document.createElement('option');
                    reviewerOption.value = user.id;
                    reviewerOption.textContent = user.username;
                    if (isValue(task) && user.id === task.reviewer.id) {
                        reviewerOption.selected = true;
                    }
                    reviewerSelect.appendChild(reviewerOption);
                });
            })
            .catch(error => {
                console.error(error);
                location.href = "/login";
            });
    }

    const ICON_EDIT = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
    const ICON_DELETE = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>';

    function formatCommentDate(creationDate) {
        if (creationDate == null || creationDate === '') {
            return '';
        }
        if (typeof creationDate === 'string') {
            const d = new Date(creationDate);
            return isNaN(d.getTime()) ? creationDate : d.toLocaleString();
        }
        if (Array.isArray(creationDate) && creationDate.length >= 3) {
            const y = creationDate[0];
            const m = creationDate[1];
            const day = creationDate[2];
            const h = creationDate[3] ?? 0;
            const min = creationDate[4] ?? 0;
            const sec = creationDate[5] ?? 0;
            return new Date(y, m - 1, day, h, min, sec).toLocaleString();
        }
        return String(creationDate);
    }

    function uploadCommentsToPage(taskId) {
        fetch(gateway_host + '/api/comment?taskId=' + taskId.value, {
            method: "GET",
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: null
        })
            .then(response => response.json())
            .then(comments => {
                commentsList.replaceChildren();
                comments.forEach(comment => {
                    const item = document.createElement('article');
                    item.className = 'comment-item';
                    item.dataset.commentId = comment.id;
                    item.setAttribute('role', 'listitem');

                    const header = document.createElement('div');
                    header.className = 'comment-header';

                    const meta = document.createElement('div');
                    meta.className = 'comment-meta';
                    const username = comment.author && comment.author.username != null ? comment.author.username : '';
                    const dateStr = formatCommentDate(comment.creationDate);
                    meta.textContent = dateStr ? username + ' · ' + dateStr : username;
                    header.appendChild(meta);

                    const authorId = comment.author && comment.author.id;
                    if (loggedInUserId != null && authorId != null
                        && String(authorId) === String(loggedInUserId)) {
                        const actions = document.createElement('div');
                        actions.className = 'comment-actions';
                        const editBtn = document.createElement('button');
                        editBtn.type = 'button';
                        editBtn.className = 'comment-icon-btn';
                        editBtn.setAttribute('aria-label', 'Edit comment');
                        editBtn.title = 'Edit comment (not implemented)';
                        editBtn.innerHTML = ICON_EDIT;
                        editBtn.addEventListener('click', function () {
                            showFeatureNotImplemented('Edit comment');
                        });
                        const delBtn = document.createElement('button');
                        delBtn.type = 'button';
                        delBtn.className = 'comment-icon-btn';
                        delBtn.setAttribute('aria-label', 'Delete comment');
                        delBtn.title = 'Delete comment (not implemented)';
                        delBtn.innerHTML = ICON_DELETE;
                        delBtn.addEventListener('click', function () {
                            showFeatureNotImplemented('Delete comment');
                        });
                        actions.appendChild(editBtn);
                        actions.appendChild(delBtn);
                        header.appendChild(actions);
                    }

                    const body = document.createElement('div');
                    body.className = 'comment-body';
                    body.textContent = comment.comment != null ? comment.comment : '';

                    item.appendChild(header);
                    item.appendChild(body);

                    commentsList.appendChild(item);
                });
            })
            .catch(error => {
                console.error(error);
            });
    }

    function saveTask() {
        const statuses = document.querySelectorAll('input[name="status"]');
        let statusValue;
        for (const s of statuses) {
            if (s.checked) {
                statusValue = s.value;
            }
        }

        const taskDto = {
            id: taskId.value,
            name: taskName.value,
            describe: describe.value,
            boardId: boardId.value,
            author: {id: authorSelect.value, username: ""},
            executor: {id: executorSelect.value, username: ""},
            reviewer: {id: reviewerSelect.value, username: ""},
            creationDate: creationDate.value,
            plannedCompletionDate: plannedCompletionDate.value,
            actualCompletionDate: actualCompletionDate.value,
            taskStatusValue: statusValue
        };

        if (isValue(taskId.value)) {
            fetch(gateway_host + "/api/task/" + taskId.value, {
                method: "PUT",
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(taskDto)
            })
                .then(response => response.json())
                .then(function () {
                    location.href = "/task-management/board/" + boardId.value;
                })
                .catch(error => console.error(error));
        } else {
            fetch(gateway_host + "/api/task", {
                method: "POST",
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(taskDto)
            })
                .then(response => response.json())
                .then(function () {
                    location.href = "/task-management/board/" + boardId.value;
                })
                .catch(error => console.error(error));
        }
    }

    function saveNewComment() {
        const commentDto = {
            id: null,
            author: {id: loggedInUserId, username: ""},
            task: {id: taskId.value, name: ""},
            creationDate: null,
            comment: newComment.value
        };

        fetch(gateway_host + "/api/comment", {
            method: "POST",
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(commentDto)
        })
            .then(response => response.json())
            .then(function () {
                location.href = "/task-management/board/" + boardId.value + "/task/" + taskId.value;
            })
            .catch(error => console.error(error));
    }

    function isValue(val) {
        return (val !== undefined && val != null && val !== '');
    }
</script>

</body>
</html>
