<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · HedgehogOps</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any">
    <link rel="stylesheet" href="/css/jira-like.css">
</head>

<body>

<div class="login-page">
    <div class="login-card">
        <p class="login-brand">HedgehogOps</p>
        <h2>Sign in</h2>
        <p class="login-tagline">Roll your work forward — one quill at a time.</p>
        <p class="muted">Use your account to access boards and tasks.</p>

        <div class="form-row">
            <label class="form-label" for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username"/>
        </div>
        <div class="form-row">
            <label class="form-label" for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password"/>
        </div>

        <div class="login-form-actions">
            <button class="btn btn-primary" type="button" onclick="login()">Log in</button>
            <button class="btn btn-subtle" type="button" id="createAccount" onclick="createAccount()">Create account</button>
        </div>

        <div class="login-alerts" id="loginAlerts" aria-live="polite"></div>
    </div>
</div>

<script>
    const gateway_host = "http://localhost:8080";

    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const loginAlerts = document.getElementById('loginAlerts');

    localStorage.removeItem('token');

    function login() {
        const loginRequestDto = {username: username.value, password: password.value};
        fetch(gateway_host + "/api/auth/login", {
            method: "POST",
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(loginRequestDto)
        })
            .then(response => response.json())
            .then(loginResponse => {
                if (isValue(loginResponse.token)) {
                    localStorage.setItem('token', loginResponse.token);
                } else {
                    addErrorMessage(loginResponse.message);
                }
            })
            .then(function () {
                if (isValue(localStorage.getItem('token'))) {
                    location.href = "/task-management";
                }
            })
            .catch(error => console.error(error));
    }

    function createAccount() {
        const loginRequestDto = {username: username.value, password: password.value};
        fetch(gateway_host + "/api/user", {
            method: "POST",
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(loginRequestDto)
        })
            .then(response => response.json())
            .then(user => {
                addMessage("The account for the user " + user.username +
                    " has been successfully created. Please enter your new credentials.");
            })
            .catch(error => console.error(error));
    }

    function isValue(val) {
        return (val !== undefined && val != null && val !== '');
    }

    function addErrorMessage(message) {
        const el = document.createElement("p");
        el.className = "msg-error";
        el.textContent = message;
        loginAlerts.appendChild(el);
    }

    function addMessage(message) {
        const el = document.createElement("p");
        el.className = "msg-success";
        el.textContent = message;
        loginAlerts.appendChild(el);
    }
</script>

</body>
</html>
